#ba-app-tour{color-scheme:inherit;--ba2-paper:#a0d3d7;--ba2-panel:light-dark(#fff,#23282f);--ba2-ink:light-dark(#25282e,#f3f1e9);--ba2-muted:light-dark(#36565b,#b4ccd4);--ba2-line:light-dark(#7ab9c1,#2c6374);--ba2-action:light-dark(#25282e,#f3f1e9);--ba2-onaction:light-dark(#fffdf8,#20242b);--ba2-brand:light-dark(#8f3026,#ff9175);--ba2-blue:light-dark(#3658bd,#a6baff);--ba2-onblue:light-dark(#fffdf8,#1d2436);--ba2-bluewash:light-dark(#e5eaf7,#303d5a);--ba2-orange:light-dark(#b86617,#e5ae69);--ba2-orangewash:light-dark(#f2e1cc,#4c3c2e);--ba2-green:light-dark(#28573f,#b4d9bf);--ba2-greenwash:light-dark(#e5ede2,#2c433c);--ba2-pink:light-dark(#ad6585,#e8b2ce);--ba2-pinkwash:light-dark(#f0e3eb,#453440);--ba2-red:light-dark(#972a21,#ff9a8a);--ba2-redwash:light-dark(#f7e4de,#4e3435);--ba2-gold:light-dark(#77551f,#e6c589);--ba2-goldwash:light-dark(#f4eacb,#4b402a);--ba2-arena:light-dark(#c7d6bd,#4c695d);--ba2-edge:light-dark(#8ca98e,#3c534d);--ba2-sky:light-dark(#e6ecdc,#334b43);--ba2-dark:light-dark(#303333,#1d242c);--ba2-face:light-dark(#e8b290,#e1a986);--ba2-shadow:light-dark(#26272c12,#00000030);--ba2-artpaper:light-dark(#fffdf1,#fffdf1);--ba2-artink:light-dark(#303234,#303234);--ba2-artred:light-dark(#de634a,#d2614b);--ba2-artblue:light-dark(#5079bd,#557bb9);--ba2-artgreen:light-dark(#6a9d80,#74a088);--ba2-artgold:light-dark(#edc85d,#dbbb62);--ba2-artlilac:light-dark(#c2a6dd,#c0a8d6);--ba2-post-reverse:light-dark(#f0b19e,#d69a8a);--ba2-post-anagram:light-dark(#aacee5,#98b9cf);--ba2-post-memory:light-dark(#cebbdf,#b3a2c7);--ba2-post-math:light-dark(#d9e8a9,#c0d092);--ba2-post-colors:light-dark(#efcf7b,#d5b971);--ba2-post-trivia:light-dark(#b6d0b6,#a1bca8);--ba2-font:'BA Rubik',Arial,sans-serif;--ba2-head:'BA Dela','Arial Black',sans-serif;color:var(--ba2-ink);font-family:var(--ba2-font);padding:16px 8px 12px}
#ba-app-tour *{box-sizing:border-box}
#ba-app-tour [hidden]{display:none!important}
#ba-app-tour .ba2-wrap{max-width:440px;margin:auto}
#ba-app-tour .ba2-preview{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 3px 12px;font-size:12px;color:var(--ba2-muted)}
#ba-app-tour .ba2-preview label{display:flex;min-width:0}
#ba-app-tour .ba2-preview select{max-width:211px;min-width:0;min-height:38px;background:var(--ba2-panel);color:var(--ba2-ink);border:1px solid var(--ba2-line);border-radius:7px;padding:8px;font:inherit}
#ba-app-tour .ba2-phone{color-scheme:light;color:var(--ba2-ink);background:var(--ba2-paper);border:1px solid var(--ba2-line);border-radius:28px;overflow:hidden;box-shadow:0 12px 32px var(--ba2-shadow)}
#ba-app-tour .ba2-top{height:76px;padding:15px 21px;display:flex;align-items:center;justify-content:space-between;gap:10px}
#ba-app-tour .ba2-top-left{display:flex;align-items:center;gap:3px;min-width:0}
#ba-app-tour .ba2-brand{display:block;font:400 20px var(--ba2-head);letter-spacing:-1.2px;line-height:1;color:var(--ba2-ink);white-space:nowrap;position:relative;padding-bottom:5px}
#ba-app-tour .ba2-brand em{font-style:normal;color:var(--ba2-brand)}
#ba-app-tour .ba2-brand:after{content:'';display:block;position:absolute;right:1px;bottom:0;width:31px;height:3px;background:var(--ba2-brand);transform:rotate(-5deg)}
#ba-app-tour .ba2-mark{display:none}
#ba-app-tour .ba2-iconbtn{background:transparent;border:0;color:var(--ba2-ink);display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:40px;min-height:40px;padding:8px;border-radius:50%;position:relative}
#ba-app-tour .ba2-iconbtn:hover{background:var(--ba2-line)}
#ba-app-tour .ba2-notifdot{position:absolute;right:9px;top:8px;border:2px solid var(--ba2-paper);width:9px;height:9px;background:var(--ba2-brand);border-radius:50%}
#ba-app-tour i{display:inline-flex;flex-shrink:0}
#ba-app-tour [data-lucide],#ba-app-tour .ba2-iconbtn svg{width:20px;height:20px}
#ba-app-tour .ba2-main{padding:7px 22px 25px;min-height:520px}
#ba-app-tour h1,#ba-app-tour h2,#ba-app-tour h3,#ba-app-tour p{margin:0}
#ba-app-tour h1{font:400 27px/1.2 var(--ba2-head);letter-spacing:-.9px;margin:10px 0 18px;overflow-wrap:break-word}
#ba-app-tour h2{font:500 21px/1.2 var(--ba2-font);letter-spacing:-.6px;margin-bottom:9px}
#ba-app-tour h3{font:500 16px/1.3 var(--ba2-font);letter-spacing:-.25px}
#ba-app-tour p{font-size:14px;line-height:1.5}
#ba-app-tour strong{font-weight:700}
#ba-app-tour .ba2-muted{color:var(--ba2-muted)}
#ba-app-tour .ba2-small{font-size:12px;line-height:1.5}
#ba-app-tour .ba2-eyebrow{font-size:12px;font-weight:500;letter-spacing:.6px;color:var(--ba2-muted);margin-bottom:9px}
#ba-app-tour .ba2-row{display:flex;align-items:center;gap:10px}
#ba-app-tour .ba2-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
#ba-app-tour .ba2-stack{display:flex;flex-direction:column;gap:12px}
#ba-app-tour .ba2-section{margin-top:25px}
#ba-app-tour .ba2-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
#ba-app-tour .ba2-section-head h2{margin:0;font-size:19px;font-weight:500}
#ba-app-tour .ba2-pair{display:grid;grid-template-columns:1fr 1fr;gap:11px}
#ba-app-tour button,#ba-app-tour input,#ba-app-tour select{font-family:var(--ba2-font)}
#ba-app-tour button{color:inherit}
#ba-app-tour .ba2-primary,#ba-app-tour .ba2-secondary{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:50px;padding:13px 18px;border-radius:14px;font:500 14px var(--ba2-font);transition:transform .15s,background .15s}
#ba-app-tour .ba2-primary{background:var(--ba2-action);color:var(--ba2-onaction);border:0}
#ba-app-tour .ba2-primary:hover{transform:translateY(-2px)}
#ba-app-tour .ba2-primary:active,#ba-app-tour .ba2-secondary:active{transform:scale(.98)}
#ba-app-tour .ba2-secondary{background:transparent;color:var(--ba2-ink);border:1px solid var(--ba2-line)}
#ba-app-tour .ba2-primary:disabled,#ba-app-tour .ba2-secondary:disabled{opacity:.45}
#ba-app-tour .ba2-inline{width:auto;min-height:44px;padding:11px 16px;border-radius:13px}
#ba-app-tour .ba2-link{background:transparent;border:0;color:var(--ba2-ink);padding:8px 0;font-size:12px;font-weight:500;min-height:36px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
#ba-app-tour .ba2-link:hover{text-decoration:underline;text-underline-offset:4px}
#ba-app-tour .ba2-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;background:var(--ba2-line);color:var(--ba2-ink);border-radius:6px;font-size:12px;font-weight:500}
#ba-app-tour .ba2-badge.green{background:var(--ba2-greenwash);color:var(--ba2-green)}
#ba-app-tour .ba2-badge.gold{background:var(--ba2-goldwash);color:var(--ba2-gold)}
#ba-app-tour .ba2-badge.red{background:var(--ba2-redwash);color:var(--ba2-red)}
#ba-app-tour .ba2-rule{height:1px;border:0;background:var(--ba2-line);margin:20px 0}

  <script>
  (function(){
    const root=document.getElementById('ba-app-tour');if(!root)return;
    const main=root.querySelector('#ba2-main'),picker=root.querySelector('#ba2-screen-picker'),nav=root.querySelector('#ba2-nav'),back=root.querySelector('#ba2-back'),toast=root.querySelector('#ba2-toast'),announce=root.querySelector('#ba2-announcement');
    const $=s=>root.querySelector(s),$$=s=>Array.from(root.querySelectorAll(s));
    const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const icon=n=>'<i data-lucide="'+n+'" aria-hidden="true"></i>';
    const btn=(text,attrs='',secondary=false)=>'<button type="button" class="'+(secondary?'ba2-secondary':'ba2-primary')+' cursor-interaction" '+attrs+'>'+text+'</button>';
    const route=(text,to,secondary=false)=>btn(text,'data-go="'+to+'"',secondary);
    const head=(eyebrow,title,sub='')=>'<h1>'+title+'</h1>'+(gameKeys.includes(current)&&sub?'<p class="ba3-game-cue">'+sub+'</p>':'');
    const badge=(t,c='')=>'<span class="ba2-badge '+c+'">'+t+'</span>';
    const games={
      reverse:{name:'Ters Köşe',kind:'KELİME',tone:'',desc:'Tersten yazılmış kelimeyi bul.',detail:'Harfler ters sırada. Kelimeyi doğru yönde düşün ve yaz. Her aşamada kelime biraz daha uzar.',art:'<div class="letters"><b>P</b><b>A</b><b>T</b><b>İ</b><b>K</b></div>'},
      anagram:{name:'Harf Harmanı',kind:'KELİME',tone:'orange',desc:'Dağınık harfleri bir araya getir.',detail:'Karışık harflere sırayla dokun, gizlenen kelimeyi oluştur. Yerleştirmeyi temizleyip yeniden deneyebilirsin.',art:'<div class="letters"><b>M</b><b>E</b><b>A</b><b>L</b></div>'},
      memory:{name:'Hafıza İzi',kind:'HAFIZA',tone:'green',desc:'Işıkları izle, sırayı hatırla.',detail:'Kutuların yanma sırasını izle. Işıklar söndüğünde aynı kutulara aynı sırayla dokun.',art:'<div class="memory">'+Array(9).fill('<b></b>').join('')+'</div>'},
      math:{name:'Eksik Sayı',kind:'SAYI',tone:'gold',desc:'İşlemin kayıp parçasını tamamla.',detail:'Sonuç belli, bir sayı eksik. Sayı tuşlarını veya klavyeyi kullanarak boşluğu tamamla.',art:'<div class="sum">6 × ?</div>'},
      colors:{name:'Renk Avı',kind:'DİKKAT',tone:'pink',desc:'Yazının rengini yakala.',detail:'Ekrandaki yazının rengini seç. Kelimeler ve renkler değiştikçe dikkatini koru.',art:'<div class="colorword">MAVİ</div>'},
      trivia:{name:'Bilgi Arenası',kind:'BİLGİ',tone:'',desc:'Seçimini yap, platformda kal.',detail:'Dört platformdan birini seç. Cevabın gizlice kilitlenir. Ortak süre bitince seçimler açılır ve yanlış platformlar düşer.',art:'<div class="island"></div><div class="smallperson">ba</div>'}
    };
    const gameKeys=Object.keys(games);
    let current='home',trail=[],detailKey='reverse',rankTab='week',transactionKind='prize',withdrawReview=false,withdrawAmount=1000,game=null,sequence=0;
    const money=n=>new Intl.NumberFormat('tr-TR',{maximumFractionDigits:0}).format(n)+' TL';
    let player={name:'Salih Tekin',handle:'salihtek',sound:false,reduced:false,reminders:true};
    let result={key:'reverse',score:20,total:30,correct:2,steps:3,mode:'practice'};
    const tasks={reverse:['KİTAP','YAPRAK','MERDİVEN'],anagram:['ELMA','BULUT','DENİZ'],memory:[[0,4,2],[6,1,8,4],[2,5,8,7,3]],math:[{left:'6',operator:'×',right:null,out:'42',answer:'7'},{left:'18',operator:'+',right:null,out:'45',answer:'27'},{left:null,operator:'÷',right:'4',out:'9',answer:'36'}],colors:[{word:'KIRMIZI',tone:'blue',answer:'Mavi'},{word:'MAVİ',tone:'green',answer:'Yeşil'},{word:'YEŞİL',tone:'red',answer:'Kırmızı'}],trivia:[{q:'Bir ışık yılı neyin ölçüsüdür?',a:['Zaman','Uzaklık','Hız','Sıcaklık'],correct:1},{q:'Tamamı Türkiye sınırları içinde akan en uzun nehir hangisidir?',a:['Fırat','Dicle','Kızılırmak','Sakarya'],correct:2},{q:'Bir üçgenin iç açıları toplamı kaç derecedir?',a:['90°','120°','270°','180°'],correct:3}]};
    // Every player in a stage receives the same preset window, independent of device or answer speed.
    const stageLimits={reverse:[10,10,15],anagram:[10,10,10],memory:[10,15,15],math:[10,15,15],colors:[10,10,10],trivia:[10,15,10]};
    const stageSeconds=(key,step)=>stageLimits[key][step];
    const pending=new Set();let interval=null,canvas=null,ctx=null,lastPaint=0;
    const reducedMedia=window.matchMedia('(prefers-reduced-motion: reduce)');
    const reduce=()=>player.reduced||reducedMedia.matches;
    function later(fn,ms){const id=setTimeout(()=>{pending.delete(id);if(root.isConnected)fn();},ms);pending.add(id);return id;}
    function clearWork(){pending.forEach(clearTimeout);pending.clear();if(interval!==null){clearInterval(interval);interval=null;}canvas=null;ctx=null;sequence++;}
    function notify(text){toast.textContent=text;toast.hidden=false;}
    function cover(key,large=false){return '<div class="ba2-cover'+(large?' large':'')+'" style="--ba3-poster:var(--ba2-post-'+key+')" aria-hidden="true"><canvas data-cover="'+key+'"></canvas></div>';}
    function tile(key){const g=games[key];return '<button type="button" class="ba2-game-tile cursor-interaction" data-detail="'+key+'">'+cover(key)+'<span class="ba2-game-copy"><h3>'+g.name+'</h3>'+icon('arrow-up-right')+'</span></button>';}
    function person(initials='ST',big=false){return '<span class="ba2-avatar'+(big?' big':'')+'" aria-hidden="true"><canvas data-avatar="'+esc(initials)+'"></canvas></span>';}
    function menuRow(symbol,title,sub,to){return '<button type="button" class="ba2-listrow cursor-interaction" data-go="'+to+'"><span class="ba2-listicon">'+icon(symbol)+'</span><span class="grow"><strong>'+title+'</strong><span class="ba2-small ba2-muted">'+sub+'</span></span>'+icon('chevron-right')+'</button>';}
    function authField(label,name,type='text',placeholder='',value='',extra=''){return '<label class="ba2-field">'+label+'<input class="ba2-input" name="'+name+'" type="'+type+'" placeholder="'+placeholder+'" value="'+esc(value)+'" '+extra+'></label>';}
    function art(){return '<div class="ba2-welcome-art" aria-hidden="true"><span class="ba2-art-tag">TERSİNDEN BAK. DOĞRUSUNU BUL.</span><div class="ba2-art-floor"></div><div class="ba2-art-letters">'+['P','A','T','İ','K'].map((v,i)=>'<span style="--i:'+i+'">'+v+'</span>').join('')+'</div><span class="ba2-pixel-person"></span></div>';}
    function welcome(){return '<div class="ba3-welcome"><h1>Bir tur?</h1><p>6 oyun. Bir haftalık yarış.</p>'+cover('reverse')+'</div><div class="ba2-stack">'+route('Başla '+icon('arrow-right'),'register')+route('Giriş yap','login',true)+'</div><div class="ba2-auth-note">Ücretsiz katılım · Haftalık final: 1.000 TL</div><button type="button" class="ba2-link cursor-interaction" data-go="home" style="display:flex;margin:10px auto 0">Önce keşfet '+icon('arrow-right')+'</button>';}
    function login(){return head('','Giriş yap.')+'<form class="ba2-form" data-form="login">'+authField('E-posta','email','email','ornek@eposta.com','','required autocomplete="off"')+'<label class="ba2-field">Şifre<span class="ba2-password"><input class="ba2-input" name="password" type="password" placeholder="Şifren" required minlength="8" autocomplete="off"><button type="button" class="ba2-iconbtn cursor-interaction" data-action="password" aria-label="Şifreyi göster">'+icon('eye')+'</button></span></label><div class="ba2-between"><label class="ba2-check"><input type="checkbox" name="remember">Beni hatırla</label><button type="button" class="ba2-link cursor-interaction" data-go="forgot">Şifremi unuttum</button></div><button type="submit" class="ba2-primary cursor-interaction">Giriş yap '+icon('arrow-right')+'</button></form><div class="ba2-auth-note">Hesabın yok mu? <button type="button" class="ba2-link cursor-interaction" data-go="register">Kayıt ol</button></div>'+route('Örnek hesapla dene','home',true);}
    function register(){return head('','Kayıt ol.')+'<form class="ba2-form" data-form="register">'+authField('Kullanıcı adı','handle','text','Örn. kelimeustasi','','required minlength="3" maxlength="18" pattern="[A-Za-z0-9_]{3,18}" autocomplete="off"')+authField('E-posta','email','email','ornek@eposta.com','','required autocomplete="off"')+authField('Şifre','password','password','En az 8 karakter','','required minlength="8" autocomplete="off"')+'<label class="ba2-check"><input type="checkbox" name="terms" required>Katılım koşullarını ve gizlilik bilgilendirmesini okudum.</label><button type="button" class="ba2-link cursor-interaction" data-go="rules" style="align-self:flex-start">Koşulları oku '+icon('arrow-up-right')+'</button><button type="submit" class="ba2-primary cursor-interaction">Hesabını oluştur '+icon('arrow-right')+'</button></form><div class="ba2-auth-note">Hesabın var mı? <button type="button" class="ba2-link cursor-interaction" data-go="login">Giriş yap</button></div>';}
    function forgot(){return head('HESABINA DÖN','Şifreni yenile.','Şifre yenileme bağlantısı için hesabına bağlı e-posta adresini kullan.')+'<form class="ba2-form" data-form="forgot">'+authField('E-posta','email','email','ornek@eposta.com','','required autocomplete="off"')+'<button type="submit" class="ba2-primary cursor-interaction">Bağlantı iste</button></form><div class="ba2-section">'+route('Girişe dön','login',true)+'</div>';}
    function home(){
      const initials=player.name.trim().split(/\s+/).map(v=>Array.from(v)[0]||'').slice(0,2).join('').toLocaleUpperCase('tr-TR');
      return '<div class="ba3-title-row"><h1>Oyun zamanı.</h1><button type="button" class="ba2-iconbtn cursor-interaction" data-go="profile" aria-label="Oyuncu profilim">'+person(initials)+'</button></div><button type="button" class="ba3-league cursor-interaction" data-go="ranking"><span class="place">142.</span><small>Haftalık sıra</small><span class="points">1.840 <small>puan</small></span>'+icon('chevron-right')+'</button><section class="ba3-feature">'+cover('reverse')+'<span class="ba3-stamp">10–15 sn</span><div class="ba3-feature-bottom"><h2>Ters Köşe</h2>'+btn('Oyna '+icon('arrow-right'),'data-start="reverse" data-mode="practice"')+'</div></section><section class="ba2-section"><div class="ba2-section-head"><h2>Bir de bunları dene</h2><button type="button" class="ba2-link cursor-interaction" data-go="games">Tümü '+icon('arrow-right')+'</button></div><div class="ba2-game-grid">'+tile('memory')+tile('math')+'</div></section><button type="button" class="ba3-final-mini cursor-interaction" data-go="final"><canvas data-cover="prize" aria-hidden="true"></canvas><span><small>PAZAR · 21.00</small><strong>1.000 TL finali</strong></span>'+icon('arrow-up-right')+'</button>';
    }
    function gameSalon(){return head('','Oyunlar.')+'<div class="ba2-between" style="margin:0 0 21px"><span class="ba2-small ba2-muted">6 farklı oyun</span>'+badge('2 puanlı tur hakkın var')+'</div><div class="ba2-game-grid">'+gameKeys.map(tile).join('')+'</div><button type="button" class="ba2-link cursor-interaction" data-go="rules" style="display:flex;margin:20px auto 0">Puanlar nasıl hesaplanıyor? '+icon('arrow-up-right')+'</button>';}
    function gameDetail(){const g=games[detailKey];return cover(detailKey,true)+head('',g.name)+'<p class="ba2-small ba2-muted">'+g.desc+'</p><div class="ba2-info-strip"><span>10 aşama</span><span>10–15 sn</span><span>En çok 100 puan</span></div><div class="ba2-stack">'+btn('Puanlı oyna '+icon('arrow-right'),'data-start="'+detailKey+'" data-mode="ranked"')+btn('Alıştırma','data-start="'+detailKey+'" data-mode="practice"',true)+'</div><details class="ba2-section"><summary class="cursor-interaction">Nasıl oynanır?</summary><p>'+g.detail+'</p></details><p class="ba2-game-help">Bu provada 3 aşama oynanır.</p>';}
    function rankRow(n,name,score,mine=false){return '<div class="ba2-rankrow'+(mine?' mine':'')+'"><span class="ba2-ranknum">'+n+'</span>'+person(name==='Sen'?'ST':name.slice(0,2).toLocaleUpperCase('tr-TR'))+'<span><strong>'+esc(name)+'</strong>'+(mine?'<span class="ba2-small ba2-muted" style="display:block;margin-top:4px">İlk 200 içindesin</span>':'')+'</span><strong style="font-size:13px;font-variant-numeric:tabular-nums">'+score+'</strong></div>';}
    function ranking(){
      const podium='<div class="ba3-podium"><div>'+person('ZE')+'<strong>Zeynep</strong><small>2.020 puan</small><div class="rank">2</div></div><div class="middle">'+person('DE')+'<strong>Deniz</strong><small>2.080 puan</small><div class="rank">1</div></div><div>'+person('ME')+'<strong>Mert</strong><small>2.010 puan</small><div class="rank">3</div></div></div>';
      return head('','İlk 200.')+'<div class="ba2-segments" role="group" aria-label="Sıralama dönemi"><button type="button" class="cursor-interaction" data-rank="week" aria-pressed="'+(rankTab==='week')+'">Bu hafta</button><button type="button" class="cursor-interaction" data-rank="last" aria-pressed="'+(rankTab==='last')+'">Geçen hafta</button></div>'+(rankTab==='week'?podium+rankRow('4','Elif','1.990')+rankRow('5','Can','1.980')+rankRow('142','Sen','1.840',true)+'<div class="ba2-between ba2-section"><span class="ba2-small ba2-muted">Final sınırı · 200. sıra</span><strong style="font-size:13px">1.680 puan</strong></div><div class="ba2-section">'+route('Final lobisi '+icon('arrow-right'),'final')+'</div>':'<div class="ba2-cover large" style="--ba3-poster:var(--ba2-post-math)" aria-hidden="true"><canvas data-cover="prize"></canvas></div><div class="ba2-between"><h2>Şampiyon: Sen</h2>'+badge('1.000 TL','gold')+'</div>'+rankRow('1','Sen','2.040')+rankRow('2','Deniz','2.010')+rankRow('3','Ece','1.990'));
    }
    function finalLobby(){return head('','Final gecesi.')+'<div class="ba3-final-poster"><div class="ba2-between"><span class="ba2-small">PAZAR · 21.00</span><span class="ba2-small">BÜYÜK FİNAL</span></div><div class="prize" style="margin-top:12px">1.000 TL</div><canvas data-cover="prize" aria-hidden="true"></canvas><div class="caption"><span>200 finalist</span><span>1 kazanan</span><span>Ücretsiz katılım</span></div></div><div class="ba2-feedback good">142. sıradasın · Şu an final bölgesindesin.</div><div class="ba2-steps"><div><b>1</b><span><strong>20.30</strong> · Sıralama kapanır.</span></div><div><b>2</b><span><strong>21.00</strong> · Eleme turları başlar.</span></div><div><b>3</b><span>Son kalan oyuncu <strong>1.000 TL</strong> kazanır.</span></div></div>'+btn('Finali dene '+icon('arrow-right'),'data-start="trivia" data-mode="final"')+'<button type="button" class="ba2-link cursor-interaction" data-go="rules" style="display:flex;margin:12px auto 0">Katılım kuralları '+icon('arrow-up-right')+'</button>';}
    function transactionRow(kind,title,sub,amount,positive=false){return '<button type="button" class="ba2-listrow cursor-interaction" data-tx="'+kind+'"><span class="ba2-listicon'+(positive?' green':'')+'">'+icon(positive?'trophy':'arrow-up-right')+'</span><span class="grow"><strong>'+title+'</strong><span class="ba2-small ba2-muted">'+sub+'</span></span><span class="ba2-amount"'+(positive?' style="color:var(--ba2-green)"':'')+'>'+amount+'</span></button>';}
    function earnings(){return head('','Kazançlarım.')+'<div class="ba2-money"><div class="ba2-small ba2-muted">Çekilebilir ödül</div><div class="amount">1.000 <span style="font-family:var(--ba2-font);font-size:24px">TL</span></div>'+route('Ödülünü çek '+icon('arrow-up-right'),'withdraw')+'</div><div class="ba2-totals"><div><span class="ba2-small ba2-muted">Toplam ödül</span><strong>2.000 TL</strong></div><div><span class="ba2-small ba2-muted">Ödenen</span><strong>1.000 TL</strong></div></div><div class="ba2-section-head"><h3>Hareketler</h3><span class="ba2-small ba2-muted">İncelemede: 0 TL</span></div><div class="ba2-list">'+transactionRow('prize','Final ödülü','18 Ekim · Onaylandı','+1.000 TL',true)+transactionRow('paid','Banka ödemesi','12 Ekim · Tamamlandı','−1.000 TL')+transactionRow('older','Final ödülü','11 Ekim · Onaylandı','+1.000 TL',true)+'</div>';}

    const themeWatcher=new MutationObserver(()=>{readPalette();paintIllustrations();if(canvas)drawArena(performance.now());});themeWatcher.observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme','data-bs-theme']});
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readPalette();paintIllustrations();if(canvas)drawArena(performance.now());});
    if(document.fonts?.ready)document.fonts.ready.then(()=>{if(root.isConnected){paintIllustrations();if(canvas)drawArena(performance.now());}});
    readPalette();render();requestAnimationFrame(loop);
  })();
  </script>
</div>
